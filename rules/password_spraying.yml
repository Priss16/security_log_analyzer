rule_id: "RULE-002"
title: "Password Spraying"
description: "Detects many failed logins across different usernames from a single IP."
author: "SentinelTrace"
severity: "HIGH"
mitre_attack:
  tactic: "Credential Access"
  technique: "T1110.003"
detection:
  condition:
    type: "threshold"
    threshold: 10
    timeframe: "10m"
    group_by: ["source_ip"]
    filters:
      - field: "event_type"
        operator: "equals"
        value: "Failed Login"
response:
  risk_score_base: 80
