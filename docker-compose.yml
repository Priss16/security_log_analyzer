version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./rules:/app/rules
      - ./config:/app/config
      - ./sample_logs:/app/sample_logs
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
